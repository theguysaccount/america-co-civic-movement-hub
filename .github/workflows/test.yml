name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is what a Mac ships; setup-python has no 3.9 for the image ubuntu-latest now points at.
          - {os: ubuntu-24.04, python-version: "3.9"}
          - {os: ubuntu-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -t . -v
      - run: python3 -m civictools.build --site _site && python3 -m civictools.og --site _site && python3 -m civictools.guard _site
      - run: python3 -m civictools.e2e _site
